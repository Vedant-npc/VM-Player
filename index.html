<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VM Player - Studio Grade Video Streaming & Media Player</title>

    <!-- Content Security Policy & Web Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: https://i.ytimg.com; media-src 'self' blob: data: https: http:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https://noembed.com https://www.youtube.com; object-src 'none'; base-uri 'self';" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    
    <!-- Meta Descriptions and SEO -->
    <meta name="description" content="Studio-grade video player featuring precision 5s seeking, interactive volume HUD, hold-for-2X speed boost, YouTube integration, and local file drag-and-drop." />
    <meta name="keywords" content="video player, 4k player, 5s seek, 2x speed, youtube player, local video player" />
    <meta name="author" content="VM Player" />
    <meta name="theme-color" content="#090C10" />

    <!-- Open Graph / Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VM Player - Studio Grade Video Streaming" />
    <meta property="og:description" content="High performance video streaming platform with sub-second controls, volume animation, hold-to-boost 2x speed, and adaptive streaming." />
    <meta property="og:image" content="/favicon.svg" />
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:title" content="VM Player - Studio Grade Video Streaming" />
    <meta property="twitter:description" content="High performance video streaming platform with sub-second controls and adaptive streaming." />

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VM Player" />

    <!-- Typography: Plus Jakarta Sans (Clean, modern humanist geometric) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#090C10] text-[#FFFFFF] antialiased overflow-x-hidden selection:bg-[#E50914] selection:text-white">
    <div id="root" class="min-h-screen w-full flex flex-col overflow-x-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
